[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cutlist2xml"
version = "0.1.0"
description = "Turn a JSON cut list into a Premiere Pro / DaVinci Resolve / FCP7 XML timeline"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["premiere", "davinci-resolve", "fcp7", "xml", "edl", "video-editing", "timeline"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Video :: Non-Linear Editor",
]

[project.urls]
Homepage = "https://github.com/kimineuginn0-arch/cutlist2xml"

[project.scripts]
cutlist2xml = "cutlist2xml:main"

[tool.setuptools]
py-modules = ["cutlist2xml"]
